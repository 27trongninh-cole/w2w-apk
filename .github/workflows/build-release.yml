name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: |
          gradle wrapper --gradle-version 8.7 || true
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleRelease --no-daemon --stacktrace
          else gradle assembleRelease --no-daemon --stacktrace; fi

      - name: Locate & rename APK
        run: |
          find . -name "*.apk"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/W2WTest-release.apk

      - name: Xác định tên bản phát hành
        id: rel
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tagname=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tagname=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact (luôn có, kể cả không tạo release)
        uses: actions/upload-artifact@v4
        with:
          name: w2wtest-release-apk
          path: out/W2WTest-release.apk
          retention-days: 30

      - name: Tạo GitHub Release + đính kèm APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tagname }}
          name: W2W Test ${{ steps.rel.outputs.tagname }}
          files: out/W2WTest-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
