name: Build Test (aoTuV native, giai đoạn 1)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cài công cụ build
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config build-essential

      - name: Clone libogg
        run: git clone --depth 1 https://github.com/xiph/ogg.git libogg-src

      - name: Build libogg
        run: |
          cd libogg-src
          ./autogen.sh
          ./configure --prefix=$GITHUB_WORKSPACE/install --disable-shared --enable-static
          make -j$(nproc)
          make install

      - name: Clone vorbis_aotuv (beta6.03-2020)
        run: git clone --branch beta6.03-2020 --depth 1 https://github.com/AO-Yumi/vorbis_aotuv.git vorbis-aotuv-src

      - name: Build vorbis_aotuv
        run: |
          cd vorbis-aotuv-src
          export PKG_CONFIG_PATH=$GITHUB_WORKSPACE/install/lib/pkgconfig
          ./autogen.sh || autoreconf -fiv
          ./configure --prefix=$GITHUB_WORKSPACE/install --disable-shared --enable-static --with-ogg=$GITHUB_WORKSPACE/install
          make -j$(nproc)
          make install

      - name: Build wav2ogg test tool
        run: |
          gcc src/wav2ogg.c -o wav2ogg \
            -I$GITHUB_WORKSPACE/install/include \
            -L$GITHUB_WORKSPACE/install/lib \
            -lvorbisenc -lvorbis -logg -lm -static

      - name: Tạo file WAV test (sine wave 2 giây)
        run: |
          python3 -c "
          import struct, math
          sr = 44100
          dur = 2
          n = sr * dur
          data = b''.join(struct.pack('<h', int(3000*math.sin(2*math.pi*440*i/sr))) for i in range(n))
          hdr = b'RIFF' + struct.pack('<I', 36+len(data)) + b'WAVEfmt ' + struct.pack('<IHHIIHH', 16,1,1,sr,sr*2,2,16) + b'data' + struct.pack('<I', len(data))
          open('test.wav','wb').write(hdr+data)
          "

      - name: Chạy thử encode
        run: |
          ./wav2ogg test.wav test.ogg 0.4
          ls -la test.ogg
          echo "--- Vendor string (kiểm tra có đúng aoTuV không) ---"
          strings test.ogg | grep -i aotuv || echo "KHONG THAY chu aoTuV trong vendor string!"

      - name: Upload kết quả
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            test.ogg
            wav2ogg
          retention-days: 7
